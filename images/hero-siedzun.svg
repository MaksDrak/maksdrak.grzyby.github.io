<svg viewBox="0 0 420 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow2" cx="50%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#4a6b3f"/>
      <stop offset="100%" stop-color="#1e2a1e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="210" cy="150" r="190" fill="url(#glow2)"/>

  <!-- ground -->
  <ellipse cx="210" cy="424" rx="200" ry="28" fill="#16201533"/>

  <!-- back trees -->
  <g opacity="0.5">
    <path d="M60 300 Q52 230 60 170 Q88 150 116 170 Q124 230 116 300 Z" fill="#3f5438"/>
    <path d="M348 314 Q340 246 348 188 Q374 170 400 188 Q408 246 400 314 Z" fill="#3f5438"/>
  </g>

  <!-- main tree trunk -->
  <g transform="translate(150,30)">
    <path d="M40 0 C20 90 10 220 26 380 L94 380 C86 220 92 90 74 0 Z" fill="#5b4d3f"/>
    <path d="M46 0 C30 90 22 220 36 380 L58 380 C50 220 56 90 48 0 Z" fill="#4a3e33" opacity="0.55"/>
    <!-- lichen patches -->
    <ellipse cx="34" cy="60" rx="16" ry="22" fill="#6a7f4e" opacity="0.35"/>
    <ellipse cx="70" cy="140" rx="14" ry="20" fill="#6a7f4e" opacity="0.3"/>
    <ellipse cx="30" cy="230" rx="15" ry="20" fill="#6a7f4e" opacity="0.3"/>
    <ellipse cx="66" cy="300" rx="13" ry="18" fill="#6a7f4e" opacity="0.28"/>
  </g>

  <!-- siedzuń sosnowy: ruffled cauliflower-shaped mushroom at trunk base -->
  <g transform="translate(96,268)">
    <ellipse cx="90" cy="118" rx="98" ry="26" fill="#16201533"/>

    <!-- base mound -->
    <path d="M4 92 C-8 46 30 18 70 20 C86 4 128 2 150 26 C186 20 202 60 182 92 C186 112 160 128 128 122 C104 136 62 136 40 122 C10 128 -6 110 4 92Z" fill="#c9a25b"/>

    <!-- overlapping ruffles, lightest on top -->
    <g fill="#e9d8ab">
      <path d="M14 80 C6 58 24 40 44 42 C50 30 74 24 88 36 C96 26 116 26 124 38 C142 30 158 46 150 64 C160 74 152 92 134 92 C126 100 104 100 92 90 C78 100 54 98 46 86 C30 96 16 92 14 80Z"/>
      <path d="M96 46 C90 30 108 16 126 20 C134 10 154 10 162 22 C178 16 192 32 184 48 C192 58 184 74 168 72 C162 80 142 80 132 70 C120 78 100 74 94 62 C82 68 92 50 96 46Z"/>
    </g>
    <g fill="#f2e6c9">
      <path d="M28 66 C24 52 38 40 52 44 C58 34 76 32 84 42 C92 34 108 36 112 46 C124 42 132 56 124 66 C130 74 122 86 108 84 C102 90 86 90 78 82 C66 88 50 84 46 74 C34 80 28 74 28 66Z"/>
      <path d="M112 32 C110 20 124 10 138 14 C144 6 160 6 166 16 C178 12 188 26 180 36 C186 44 178 56 166 54 C160 60 146 60 140 52 C130 58 116 54 114 44 C106 46 110 36 112 32Z"/>
      <path d="M64 96 C58 84 72 72 86 76 C92 68 108 66 114 76 C124 72 132 84 124 92 C128 100 118 110 106 106 C98 112 84 110 78 102 C68 106 62 102 64 96Z"/>
    </g>

    <!-- fine crinkle lines for texture -->
    <g stroke="#b5602f" stroke-width="1.4" fill="none" opacity="0.45">
      <path d="M40 60 q8 -10 16 0"/>
      <path d="M70 48 q8 -10 16 0"/>
      <path d="M100 40 q8 -10 16 0"/>
      <path d="M130 50 q8 -10 16 0"/>
      <path d="M56 84 q8 -10 16 0"/>
      <path d="M92 88 q8 -10 16 0"/>
    </g>
  </g>

  <!-- small companion mushroom -->
  <g transform="translate(310,352)">
    <rect x="8" y="18" width="10" height="24" rx="4" fill="#f2e6c9"/>
    <path d="M0 18 C0 4 26 4 26 18 C26 24 19 16 13 16 C7 16 0 24 0 18Z" fill="#b5602f"/>
  </g>

  <!-- grass tufts -->
  <g stroke="#6a7f4e" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M42 420 q6 -22 0 -34"/>
    <path d="M52 420 q10 -18 4 -32"/>
    <path d="M368 422 q-6 -20 2 -32"/>
    <path d="M358 422 q-12 -16 -4 -30"/>
